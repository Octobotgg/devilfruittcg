name: JustTCG Refresh

on:
  schedule:
    - cron: "0 9 */2 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh mode"
        required: true
        default: "scheduled"
        type: choice
        options:
          - scheduled
          - set_refresh
      set_code:
        description: "Set code for manual set refresh"
        required: false
        default: "OP15-EB04"

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate required secrets
        run: |
          if [ -z "$JUSTTCG_API_KEY" ] || { [ -z "$SUPABASE_DB_URL" ] && [ -z "$DATABASE_URL" ]; }; then
            echo "Missing JUSTTCG_API_KEY or database connection secret, skipping refresh."
            exit 0
          fi

      - name: Install dependencies
        run: npm ci

      - name: Export JustTCG mapping cache from database
        run: npm run export:justtcg:cache

      - name: Run scheduled JustTCG refresh
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'scheduled' }}
        run: npm run refresh:justtcg:scheduled

      - name: Run manual JustTCG set refresh
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'set_refresh' }}
        run: npm run refresh:justtcg:set -- --set "${{ inputs.set_code }}"
